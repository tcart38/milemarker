services:
  milemarker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "3002:3002"
    volumes:
      - milemarker-data:/data
    environment:
      NODE_ENV: production
      PORT: 3002
      # Optional login, off unless a password is set. Prefer a bcrypt hash:
      #   docker exec -it milemarker node src/auth/hash-password.js
      # and write each $ in the hash as $$ here.
      #AUTH_USERNAME: admin
      #AUTH_PASSWORD_HASH: "$$2b$$12$$..."
      DATA_DIR: /data
      MAX_UPLOAD_SIZE_MB: 1024
      MAX_IMPORT_FILES: 100000
    restart: unless-stopped

volumes:
  milemarker-data:
